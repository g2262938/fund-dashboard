    --text-primary: #1a2332;
    --text-secondary: #5a6b7d;
    --text-dim: #8b95a3;
    --text-light: #e6edf3;
    --text-light-dim: #94a3b8;
    --up: #16a34a;
    --down: #e63946;
    --accent: #f59e0b;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    margin: 0;
    line-height: 1.55;
    min-height: 100vh;
}
.mono { font-family: "SF Mono", "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }

.layout { display: flex; min-height: 100vh; }

/* ===== Sidebar ===== */
.sidebar {
    width: 240px;
    background: var(--bg-side);
    background-image: linear-gradient(180deg, var(--bg-side) 0%, #0d2540 100%);
    color: var(--text-light);
    display: flex; flex-direction: column;
    flex-shrink: 0;
    box-shadow: 2px 0 12px rgba(0,0,0,0.1);
}
.brand {
    padding: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 12px;
}
.brand-logo {
    width: 36px; height: 36px;
    background: var(--ef-blue);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: #fff;
}
.brand-text .name { font-size: 15px; font-weight: 600; color: #fff; }
.brand-text .name span { color: #ffd966; }
.brand-text .tag { font-size: 9px; color: var(--text-light-dim); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }

.nav { flex: 1; padding: 16px 0; overflow-y: auto; }
.nav-section {
    padding: 8px 20px 6px; font-size: 10px; font-weight: 600;
    color: var(--text-light-dim); letter-spacing: 1.5px; text-transform: uppercase;
}
.nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; color: var(--text-light-dim);
    text-decoration: none; font-size: 13px;
    border-left: 3px solid transparent; cursor: pointer; transition: all 0.15s;
}
.nav-item:hover { background: var(--bg-hover); color: #fff; }
.nav-item.active { background: var(--bg-hover); color: #fff; border-left-color: #ffd966; }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
.nav-item .badge {
    margin-left: auto; font-size: 10px;
    background: rgba(255,255,255,0.12); padding: 1px 6px;
    border-radius: 10px;
}

/* ===== Main ===== */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ── Header ── */
.header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap;
}
.header-left { display: flex; flex-direction: column; gap: 2px; }
.header-left .title { font-size: 18px; font-weight: 700; color: var(--text-primary); }
.header-left .subtitle { font-size: 12px; color: var(--text-dim); }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.stat-cards {
    display: flex; gap: 12px; flex-wrap: wrap;
    padding: 20px 28px;
}
.stat-card {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    min-width: 130px;
    flex: 1;
}
.stat-card .sc-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.stat-card .sc-value { font-size: 22px; font-weight: 700; color: var(--text-primary); }
.stat-card .sc-sub { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.stat-card.danger .sc-value { color: var(--down); }
.stat-card.orange .sc-value { color: #e07b39; }

/* ── Filter bar ── */
.filter-bar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 28px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.filter-group { display: flex; align-items: center; gap: 6px; }
.filter-group label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
select, input[type="text"] {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 13px;
    color: var(--text-primary);
    background: #fff;
    outline: none;
    transition: border-color 0.15s;
}
select:focus, input[type="text"]:focus { border-color: var(--ef-blue); }
select { cursor: pointer; }

.type-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.type-tag {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    background: #fff;
    transition: all 0.15s;
}
.type-tag.active { color: #fff; }
.type-tag.active.type-loss { background: var(--down); border-color: var(--down); }
.type-tag.active.type-warning { background: #e07b39; border-color: #e07b39; }

.search-wrap { position: relative; margin-left: auto; }
.search-wrap input { padding-left: 30px; width: 180px; }
.search-wrap::before {
    content: "🔍";
    position: absolute;
    left: 8px; top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    opacity: 0.5;
}

/* ── Table ── */
.table-wrap {
    flex: 1;
    overflow: auto;
    padding: 0 28px 24px;
}
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    table-layout: fixed;
    overflow: visible;
}
thead {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg-soft);
}
th {
    padding: 10px 12px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
}
td {
    padding: 10px 12px;
    border-bottom: 1px solid #f0f0f0;
    vertical-align: middle;
}
tr:hover td { background: #fafafa; }

.col-code { width: 80px; }
.col-name { min-width: 90px; }
.col-board { width: 70px; }
.col-type { width: 70px; }
.col-loss { width: 110px; }
.col-reason { min-width: 400px; width: 400px; }
.col-date { width: 110px; }
.col-disclosure { width: 110px; }

.code-link {
    color: var(--ef-blue);
    text-decoration: none;
    font-family: monospace;
    font-size: 12px;
}
.code-link:hover { text-decoration: underline; }

.board-tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
}
.board-科创板 { background: #eef2ff; color: #4338ca; }
.board-主板 { background: #f0fdf4; color: #15803d; }
.board-中小板 { background: #fff7ed; color: #c2410c; }
.board-创业板 { background: #fdf4ff; color: #7e22ce; }
.board-B股 { background: #f1f5f9; color: #475569; }

.type-tag-inline {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
}
.type-首亏 { background: #fee2e2; color: #b91c1c; }
.type-增亏 { background: #fecaca; color: #991b1b; }
.type-续亏 { background: #ffedd5; color: #9a3412; }
.type-预减 { background: #fef3c7; color: #92400e; }

.loss-amount {
    font-weight: 700;
    font-family: monospace;
    font-size: 13px;
    color: var(--down);
}

.reason-text {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.7;
    word-break: break-word;
    overflow: visible;
    white-space: normal;
}

/* 原因格：主题标签 */
.reason-cell { display: flex; flex-direction: column; gap: 4px; }

.reason-tags { display: flex; flex-wrap: wrap; gap: 4px; }

.reason-tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    background: #fff3f0;
    color: #c0392b;
    border: 1px solid #f5c6c0;
    white-space: nowrap;
    line-height: 16px;
}

.empty-row td { text-align: center; color: var(--text-dim); padding: 40px; }

.pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px;
}
.page-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.15s;
}
.page-btn:hover { border-color: var(--ef-blue); color: var(--ef-blue); }
.page-btn.active { background: var(--ef-blue); color: #fff; border-color: var(--ef-blue); }
.page-btn:disabled { opacity: 0.4; cursor: default; }
.page-info { font-size: 12px; color: var(--text-dim); }

/* ── Footer ── */
.footer {
    border-top: 1px solid var(--border);
    padding: 12px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
    color: var(--text-dim);
    background: #fff;
}
.footer .refresh-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 11px;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.15s;
}
.footer .refresh-btn:hover { border-color: var(--ef-blue); color: var(--ef-blue); }
</style>
</head>
<body>
<div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">基</div>
            <div class="brand-text">
                <div class="name">易方达 <span>仪表板</span></div>
                <div class="tag">EFUND DASHBOARD</div>
            </div>
        </div>
        <nav class="nav" id="sidebar-nav"></nav>
    </aside>

    <!-- Main -->
    <main class="main">
        <div class="header">
            <div class="header-left">
                <div class="title">📉 中报预亏监控</div>
                <div class="subtitle" id="period-label">2026年中报 · 业绩预告风险扫描</div>
            </div>
            <div class="header-right">
                <span class="page-info" id="update-time"></span>
            </div>
        </div>

        <!-- Stats -->
        <div class="stat-cards">
            <div class="stat-card danger">
                <div class="sc-label">预亏标的总数</div>
                <div class="sc-value" id="stat-total">—</div>
                <div class="sc-sub">已过滤 · 含首亏/增亏/续亏/预减</div>
            </div>
            <div class="stat-card">
                <div class="sc-label">预亏总额</div>
                <div class="sc-value" id="stat-loss">—</div>
                <div class="sc-sub" id="stat-loss-sub">亿元（截至昨日公告）</div>
            </div>
            <div class="stat-card">
                <div class="sc-label">首亏（首次亏损）</div>
                <div class="sc-value" id="stat-shouku">—</div>
            </div>
            <div class="stat-card orange">
                <div class="sc-label">增亏（亏幅扩大）</div>
                <div class="sc-value" id="stat-zengku">—</div>
            </div>
            <div class="stat-card">
                <div class="sc-label">续亏（连续亏损）</div>
                <div class="sc-value" id="stat-xuku">—</div>
            </div>
            <div class="stat-card">
                <div class="sc-label">预减（盈利下降）</div>
                <div class="sc-value" id="stat-yujian">—</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filter-bar">
            <div class="filter-group">
                <label>板块</label>
                <select id="filter-board">
                    <option value="">全部</option>
                    <option value="主板">主板</option>
                    <option value="科创板">科创板</option>
                    <option value="创业板">创业板</option>
                    <option value="中小板">中小板</option>
                    <option value="B股">B股</option>
                </select>
            </div>
            <div class="type-tags" id="type-tags">
                <span class="type-tag type-loss active" data-type="">全部</span>
                <span class="type-tag type-loss" data-type="首亏">首亏</span>
                <span class="type-tag type-loss" data-type="增亏">增亏</span>
                <span class="type-tag type-loss" data-type="续亏">续亏</span>
                <span class="type-tag type-warning" data-type="预减">预减</span>
            </div>
            <div class="search-wrap">
                <input type="text" id="search-input" placeholder="代码 / 名称 / 拼音">
            </div>
        </div>

        <!-- Table -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th class="col-code">代码</th>
                        <th class="col-name">名称</th>
                        <th class="col-board">板块</th>
                        <th class="col-type">类型</th>
                        <th class="col-loss">预亏金额</th>
                        <th class="col-reason">亏损原因</th>
                        <th class="col-date">公告日期</th>
                        <th class="col-disclosure">披露日期</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
            <div class="pagination" id="pagination"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>数据来源：东方财富 · 业绩预告</span>
            <span>|</span>
            <span>报告期：2026年中报（1-6月）</span>
            <span>|</span>
            <span id="record-count"></span>
            <button class="refresh-btn" onclick="loadData()">刷新</button>
        </div>
    </main>
</div>

<script>
// ── 全局状态 ─────────────────────────────────────────────────────
let DATA = [];
let filtered = [];
let currentBoard = "";
let currentType = "";
let searchText = "";
let currentPage = 1;
const PAGE_SIZE = 50;

// ── 导航加载 ─────────────────────────────────────────────────────
fetch('menu.html')
    .then(r => r.text())
    .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const nav = doc.querySelector('.nav') || doc.querySelector('nav');
        if (nav) {
            document.getElementById('sidebar-nav').innerHTML = nav.innerHTML;
            document.getElementById('sidebar-nav').querySelectorAll('.nav-item').forEach(item => {
                if (item.href && item.href.includes('yjyg_loss')) {
                    item.classList.add('active');
                }
            });
        }
    })
    .catch(() => {});

// ── 加载数据 ──────────────────────────────────────────────────────
async function loadData() {
    // 优先用内嵌数据（file:// 协议），否则 fetch JSON 文件（http 服务器）
    if (EMBEDDED_DATA && EMBEDDED_DATA.records && EMBEDDED_DATA.records.length > 0) {
        DATA = EMBEDDED_DATA;
    } else {
        try {
            const r = await fetch('data/yjyg_loss_latest.json');
            DATA = await r.json();
        } catch (e) {
            // 如果 fetch 失败但有内嵌数据，用内嵌的
            if (EMBEDDED_DATA && EMBEDDED_DATA.records) {
                DATA = EMBEDDED_DATA;
            } else {
                document.getElementById('table-body').innerHTML =
                    `<tr class="empty-row"><td colspan="7">加载失败: ${e.message}</td></tr>`;
                return;
            }
        }
    }
    document.getElementById('update-time').textContent = '更新: ' + DATA.generated_at;
    document.getElementById('period-label').textContent = DATA.period + ' · 业绩预告风险扫描';
    renderStats(DATA.stats);
    applyFilters();
}

function renderStats(stats) {
    document.getElementById('stat-total').textContent = stats.total;
    document.getElementById('stat-loss').textContent = (stats.total_loss_wan / 1e4).toFixed(0) + '亿';
    document.getElementById('stat-shouku').textContent = stats['首亏'] || 0;
    document.getElementById('stat-zengku').textContent = stats['增亏'] || 0;
    document.getElementById('stat-xuku').textContent = stats['续亏'] || 0;
    document.getElementById('stat-yujian').textContent = stats['预减'] || 0;
}

// ── 过滤 ──────────────────────────────────────────────────────────
function applyFilters() {
    filtered = DATA.records.filter(r => {
        if (currentBoard && r.board !== currentBoard) return false;
        if (currentType && r.type !== currentType) return false;
        if (searchText) {
            const s = searchText.toLowerCase();
            if (!r.code.includes(s) && !r.name.includes(s) &&
                !getPinyinInitials(r.name).toLowerCase().includes(s)) return false;
        }
        return true;
    });
    currentPage = 1;
    renderTable();
    renderPagination();
}

function getPinyinInitials(name) {
    try {
        if (typeof pinyinPro === 'undefined' || !pinyinPro.pinyin) return '';
        const result = pinyinPro.pinyin(name, { pattern: 'first', toneType: 'none', type: 'array' });
        return Array.isArray(result) ? result.join('') : '';
    } catch (e) { return ''; }
}

// ── 渲染原因格（主题标签 + 摘要）───────────────────────────────
function renderReasonCell(r) {
    const summary = r.reason || '';
    const full = r.reason_full || r.reason || '';
    const tags = (r.themes || []).map(t =>
        `<span class="reason-tag">${t}</span>`
    ).join('');
    return `<div class="reason-cell">
        ${tags ? `<div class="reason-tags">${tags}</div>` : ''}
        <div class="reason-text" title="${full.replace(/"/g, '&quot;')}">${summary.replace(/\n/g, '<br>')}</div>
    </div>`;
}

// ── 渲染表格 ─────────────────────────────────────────────────────
function renderTable() {
    const start = (currentPage - 1) * PAGE_SIZE;
    const page = filtered.slice(start, start + PAGE_SIZE);
    const tbody = document.getElementById('table-body');

    if (page.length === 0) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="7">暂无数据</td></tr>`;
        return;
    }

    tbody.innerHTML = page.map(r => {
        const boardClass = 'board-' + r.board;
        const typeClass = 'type-' + r.type;
        const codeUrl = r.code.startsWith('6') || r.code.startsWith('5') || r.code.startsWith('688')
            ? `https://quote.eastmoney.com/${r.code.startsWith('688') ? 'kcb' : ''}${r.code}.html`
            : `https://quote.eastmoney.com/${r.code}.html`;
        return `<tr>
            <td class="col-code"><a class="code-link" href="${codeUrl}" target="_blank">${r.code}</a></td>
            <td class="col-name" style="font-weight:600">${r.name}</td>
            <td class="col-board"><span class="board-tag ${boardClass}">${r.board}</span></td>
            <td class="col-type"><span class="type-tag-inline ${typeClass}">${r.type}</span></td>
            <td class="col-loss"><span class="loss-amount">-${r.loss_text}</span></td>
            <td class="col-reason">${renderReasonCell(r)}</td>
            <td class="col-date mono" style="color:var(--text-dim)">${r.notice_dt}</td>
            <td class="col-disclosure mono" style="color:${r.disclosure_date ? 'var(--accent)' : 'var(--text-dim)'}">${r.disclosure_date || '—'}</td>
        </tr>`;
    }).join('');

    document.getElementById('record-count').textContent = `共 ${filtered.length} 条 / ${DATA.records.length} 条`;
}

// ── 分页 ─────────────────────────────────────────────────────────
function renderPagination() {
    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    const container = document.getElementById('pagination');
    if (totalPages <= 1) { container.innerHTML = ''; return; }

    let html = `<button class="page-btn" ${currentPage<=1?'disabled':''} onclick="goPage(${currentPage-1})">‹ 上一页</button>`;
    const pages = [];
    for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2))
            pages.push(i);
    }
    let prev = 0;
    for (const p of pages) {
        if (p - prev > 1) html += `<span class="page-info" style="padding:0 4px">…</span>`;
        html += `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
        prev = p;
    }
    html += `<button class="page-btn" ${currentPage>=totalPages?'disabled':''} onclick="goPage(${currentPage+1})">下一页 ›</button>`;
    html += `<span class="page-info">第 ${currentPage}/${totalPages} 页</span>`;
    container.innerHTML = html;
}

function goPage(p) {
    currentPage = p;
    renderTable();
    renderPagination();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── 事件绑定 ─────────────────────────────────────────────────────
document.getElementById('filter-board').addEventListener('change', e => {
    currentBoard = e.target.value;
    applyFilters();
});

document.getElementById('type-tags').addEventListener('click', e => {
    const tag = e.target.closest('.type-tag');
    if (!tag) return;
    document.querySelectorAll('.type-tag').forEach(t => t.classList.remove('active'));
    tag.classList.add('active');
    currentType = tag.dataset.type;
    applyFilters();
});

document.getElementById('search-input').addEventListener('input', e => {
    searchText = e.target.value.trim();
    applyFilters();
});

// ── 启动 ─────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
